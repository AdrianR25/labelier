<main class="text-center d-flex flex-column justify-content-center vh-100 bg-light-subtle">
    <h1>Labelier</h1>
    <p class="fs-3 fw-light">Load a new folder or a previously opened one to start labeling</p>
    <div class="hstack justify-content-center gap-3 mt-2">
        <button type="button" class="btn btn-primary" (click)="loadExistingDirectory()">Reopen saved folder</button>
        <button type="button" class="btn btn-outline-primary" (click)="loadNewDirectory()">Open new folder</button>
    </div>
</main>
